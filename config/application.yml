environment: <%= ENV['RACK_ENV'].try(:to_sym) || :production %>
rack: 'test'

builds:
  builder: :dj
  dir: '/tmp/docker/builds'
  max_running: 2
  max_run_time: 35
  output_interval: 5
  trim_branches: true
  display_count: 20

logs:
  file: 'integrity.log'
  url: 'https://papertrailapp.com/events'

<% uri = ENV['DATABASE_URL'] %>

database:
  url: <%= uri %>
  adapter: <%= URI.parse(uri).scheme %>
  database: <%= URI.parse(uri).path.gsub(/^\//,'') %>
  username: <%= URI.parse(uri).user %>
  password: <%= URI.parse(uri).password %>
  host:     <%= URI.parse(uri).host %>

auth:
  username: <%= ENV['INTEGRITY_USERNAME'] %>
  password: <%= ENV['INTEGRITY_PASSWORD'] %>

github:
  account:  <%= ENV['GITHUB_ACCOUNT']     %>
  tokens:
    read:   <%= ENV['GITHUB_READ_TOKEN']  %>
    write:  <%= ENV['GITHUB_WRITE_TOKEN'] %>
    secret: <%= ENV['GITHUB_HOOK_SECRET'] %>

tracker:
  api_token: <%= ENV['PIVOTAL_TRACKER_TOKEN'] %>
  project_id: <%= ENV['PIVOTAL_TRACKER_PROJECT_ID'] %>

sendgrid:
  api_user: <%= ENV['SENDGRID_USERNAME'] %>
  api_key: <%= ENV['SENDGRID_PASSWORD'] %>
  sender_email: 'Honesty Robot <no_reply@grandrounds.com>'
