environment: <%= ENV['RACK_ENV'] || :production %>
rack: 'test'

builds:
  builder: :dj
  dir: '/tmp/docker/builds'
  max_running: 3
  output_interval: 5
  trim_branches: true
  display_count: 20

logs:
  file: 'integrity.log'
  url: 'https://papertrailapp.com/events'

database:
  url:      <%= ENV['INTEGRITY_DATABASE_URL'] %>
  adapter:  mysql2
  database: integrity
  username: integrity
  password: MyPassword
  host:     gruzii5m6o5mis.c61hxobewq2s.us-east-1.rds.amazonaws.com

auth:
  username: <%= ENV['INTEGRITY_USERNAME'] %>
  password: <%= ENV['INTEGRITY_PASSWORD'] %>

github:
  account:  <%= ENV['GITHUB_ACCOUNT']     %>
  tokens:
    read:   <%= ENV['GITHUB_READ_TOKEN']  %>
    write:  <%= ENV['GITHUB_WRITE_TOKEN'] %>
    secret: <%= ENV['GITHUB_HOOK_SECRET'] %>
