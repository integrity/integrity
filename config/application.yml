database:
  url:      <%= ENV['INTEGRITY_DATABASE_URL'] %>
  adapter:  mysql2
  database: integrity
  username: root
  host:     localhost

auth:
  username: <%= ENV['INTEGRITY_USERNAME'] %>
  password: <%= ENV['INTEGRITY_PASSWORD'] %>

github:
  account:  <%= ENV['GITHUB_ACCOUNT']     %>
  tokens:
    read:   <%= ENV['GITHUB_READ_TOKEN']  %>
    write:  <%= ENV['GITHUB_WRITE_TOKEN'] %>
    secret: <%= ENV['GITHUB_HOOK_SECRET'] %>
