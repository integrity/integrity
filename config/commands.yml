build_template: 'curl -H "Authorization: token %s" -H "Accept: application/vnd.github.v3.raw" --remote-name --location https://api.github.com/repos/%s/%s/contents/.integrity.erb'

docker:
  build: 'docker build -t %s .'
  run:
    mysql: 'docker run -d --name %s -p 3306 grnds/mysql'
    image: 'docker run -v /tmp/bundler:/root/bundler -i -t --link %s:mysql %s'
