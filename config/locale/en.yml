notifier:
  base:
    message: |
      == %{short_message}

      Commit Message: %{message}
      Commit Date: %{commit_date}
      Commit Author: %{author}

      Link: %{build_url}

      == Build Output:

      %{build_output}

  campfire:
    message: |
      Commit Message: %{message}
      Commit Date: %{commit_date}
      Commit Author: %{author}

      %{build_output}

story:
  start_email_subject: "Alert! Story #%{story_id} Started"
  pr_email_subject: "Story %{story_id} is ready for you to PR"
  failure_email_subject: "Story %{story_id} has failed on Honesty"
  delivered_email_subject: "Story %{story_id} is ready for you to Accept/Reject"
  pr_body: "%{commit_message}\n\n[Tracker #%{story_id}](%{story_url})"
  pr_github_link: "%{github_project_url}/compare/master...%{branch_name}?title=[# %{story_id}] %{story_name}&body=%{pr_body}"
  nes_email_subject: "It's time for %{name} to start an NES story"
  nes_email_body: "Story '%{story_name}' is at the top of the NES list, it can be found here: %{story_url}"
  nes_email_body_missing_story: 'There is no story currently in the NES backlog, please discuss with Santa on what to take up next.'
